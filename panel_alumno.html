<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel — Alumno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./assets/css/theme.css">
</head>
<body>

<div id="app-navbar"></div>

<div class="container py-4">
    <div class="row g-4">
        <div class="col-lg-5">
            <div class="glass-card">
                <h4><i class="fas fa-door-open"></i> Unirse a una Clase</h4>
                <div id="alumno-alertas" class="mb-3"></div>
                <form id="form-unirse" novalidate>
                    <div class="mb-3">
                        <label class="form-label" for="codigo-acceso"><i class="fas fa-key me-1"></i> Código de acceso</label>
                        <input type="text" id="codigo-acceso" class="form-control text-uppercase" placeholder="Ej: AX93L2" maxlength="6"
                               style="font-family:'Courier New',monospace; letter-spacing:3px; text-align:center; font-size:1.3rem;" required>
                    </div>
                    <button type="submit" class="btn-neon w-100"><i class="fas fa-right-to-bracket me-1"></i> Unirme</button>
                </form>
                <p class="mt-2 mb-0" style="color:rgba(255,255,255,0.2); font-size:0.75rem; text-align:center;">
                    Pedile el código a tu profesor/a
                </p>
            </div>
        </div>

        <div class="col-lg-7">
            <div class="glass-card">
                <h4><i class="fas fa-book"></i> Mis Clases</h4>
                <div id="lista-clases"></div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="./assets/js/db.js"></script>
<script src="./assets/js/utils.js"></script>
<script src="./assets/js/auth.js"></script>
<script>
    (function () {
        'use strict';

        var sesion = GGS_LAYOUT.requerir(['alumno']);
        if (!sesion) {
            return;
        }

        GGS_LAYOUT.renderNav('panel_alumno');

        var alertas = document.getElementById('alumno-alertas');
        var lista = document.getElementById('lista-clases');
        var inputCodigo = document.getElementById('codigo-acceso');

        function mostrarAlerta(mensaje, tipo) {
            var icono = tipo === 'success' ? 'fa-check-circle' :
                (tipo === 'warning' ? 'fa-info-circle' : 'fa-exclamation-circle');
            alertas.innerHTML = '<div class="app-alert ' + tipo + '"><i class="fas ' + icono + ' me-1"></i> ' +
                GGS_UTILS.escapeHtml(mensaje) + '</div>';
        }

        function renderClases() {
            var clases = GGS_DB.getClasesDeAlumno(sesion.usuario_id);

            if (!clases.length) {
                lista.innerHTML =
                    '<div class="empty-state">' +
                        '<i class="fas fa-school"></i>' +
                        '<p>No estás inscripto en ninguna clase todavía.</p>' +
                    '</div>';
                return;
            }

            var filas = clases.map(function (clase) {
                var trabajos = GGS_DB.getTrabajosDeAlumnoEnClase(clase.id, sesion.usuario_id);
                var idColapso = 'trabajos-' + clase.id;
                var tema = clase.tema ?
                    '<div class="profesor-label"><i class="fas fa-tag"></i> ' + GGS_UTILS.escapeHtml(clase.tema) + '</div>' : '';
                var botonEntregas = '';
                var entregas = '';

                if (trabajos.length) {
                    botonEntregas =
                        '<button class="btn-neon-sm" style="border-color:rgba(0,242,255,0.08); background:rgba(0,242,255,0.03);" type="button"' +
                        ' data-bs-toggle="collapse" data-bs-target="#' + idColapso + '" aria-expanded="false" aria-controls="' + idColapso + '">' +
                            '<i class="fas fa-history"></i> Ver entregas (' + trabajos.length + ')' +
                        '</button>';

                    entregas =
                        '<div class="collapse mt-2" id="' + idColapso + '">' +
                            trabajos.map(function (trabajo) {
                                return '<div style="font-size:0.8rem; padding:0.3rem 0.5rem; border-left:2px solid rgba(0,242,255,0.15); margin-bottom:0.3rem;">' +
                                    '<span style="color:#00f2ff;">' + GGS_UTILS.escapeHtml(trabajo.titulo_trabajo) + '</span>' +
                                    '<small style="color:rgba(255,255,255,0.25); display:block;">' + GGS_UTILS.formatFecha(trabajo.fecha_entrega) + '</small>' +
                                '</div>';
                            }).join('') +
                        '</div>';
                }

                return '<tr>' +
                    '<td>' +
                        '<strong style="color:#fff;">' + GGS_UTILS.escapeHtml(clase.nombre_clase) + '</strong>' +
                        '<span class="codigo-badge ms-1">' + GGS_UTILS.escapeHtml(clase.codigo_acceso) + '</span>' +
                        tema +
                    '</td>' +
                    '<td class="profesor-label"><i class="fas fa-chalkboard-teacher"></i> ' + GGS_UTILS.escapeHtml(clase.profesor_nombre) + '</td>' +
                    '<td>' +
                        '<a href="./editor_geogebra.html?clase_id=' + clase.id + '" class="btn-neon-sm mb-1">' +
                            '<i class="fas fa-pen"></i> Construir' +
                        '</a> ' +
                        botonEntregas +
                        entregas +
                    '</td>' +
                '</tr>';
            }).join('');

            lista.innerHTML =
                '<div class="glass-table">' +
                    '<table class="table">' +
                        '<thead><tr><th>Clase</th><th>Profesor</th><th>Acción</th></tr></thead>' +
                        '<tbody>' + filas + '</tbody>' +
                    '</table>' +
                '</div>';
        }

        document.getElementById('form-unirse').addEventListener('submit', function (evento) {
            evento.preventDefault();

            var codigo = inputCodigo.value.trim().toUpperCase();

            if (!codigo) {
                mostrarAlerta('Ingresá un código.', 'danger');
                return;
            }

            var resultado = GGS_DB.unirseAClase(codigo, sesion.usuario_id);

            if (resultado.ok) {
                mostrarAlerta('Te uniste a la clase correctamente.', 'success');
                inputCodigo.value = '';
                renderClases();
                return;
            }

            if (resultado.motivo === 'duplicado') {
                mostrarAlerta('Ya estás inscripto en esa clase.', 'warning');
            } else if (resultado.motivo === 'almacenamiento') {
                mostrarAlerta('No se pudo guardar la inscripción en el almacenamiento local.', 'danger');
            } else {
                mostrarAlerta('Código inválido. Verificá con tu profesor/a.', 'danger');
            }
        });

        renderClases();
    })();
</script>
</body>
</html>
